<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">My Files AWS architecture</title>
<desc id="desc">Browser loads the frontend from Amplify Hosting. Cognito User Pool authenticates the user. Cognito Identity Pool uses that login to provide temporary credentials through an authenticated IAM role. The browser uploads, lists, downloads and deletes objects in the user's private path in Amazon S3.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081c2f"/><stop offset="1" stop-color="#123950"/></linearGradient>
  <linearGradient id="blue" x2="1"><stop stop-color="#0a6f92"/><stop offset="1" stop-color="#198bab"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#041320" flood-opacity=".25"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#70d3de"/></marker>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<circle cx="1280" cy="60" r="230" fill="#2b89a2" opacity=".08"/><circle cx="120" cy="870" r="290" fill="#2b89a2" opacity=".08"/>
<text x="80" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#69d6df" letter-spacing="3">AWS PROJECT ARCHITECTURE</text>
<text x="80" y="145" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">My Files</text>
<text x="80" y="183" font-family="Arial, sans-serif" font-size="21" fill="#b9cfdb">A personal cloud file manager built with Amplify, Cognito, IAM and Amazon S3</text>

<g font-family="Arial, sans-serif" filter="url(#shadow)">
 <rect x="74" y="277" width="260" height="180" rx="20" fill="#fff"/><rect x="74" y="277" width="260" height="12" rx="6" fill="#47b8cf"/>
 <text x="104" y="328" font-size="17" font-weight="700" fill="#0b7695">01 · USER</text><text x="104" y="371" font-size="28" font-weight="700" fill="#172f40">Browser</text><text x="104" y="408" font-size="17" fill="#526978">Sign in · Upload · Manage</text>
 <rect x="444" y="232" width="300" height="172" rx="20" fill="#fff"/><rect x="444" y="232" width="300" height="12" rx="6" fill="#ffac43"/>
 <text x="474" y="283" font-size="17" font-weight="700" fill="#bc7219">02 · FRONTEND</text><text x="474" y="327" font-size="28" font-weight="700" fill="#172f40">Amplify Hosting</text><text x="474" y="365" font-size="17" fill="#526978">Serves index.html</text>
 <rect x="444" y="480" width="300" height="174" rx="20" fill="#fff"/><rect x="444" y="480" width="300" height="12" rx="6" fill="#a690e9"/>
 <text x="474" y="531" font-size="17" font-weight="700" fill="#7057b5">03 · AUTHENTICATION</text><text x="474" y="575" font-size="28" font-weight="700" fill="#172f40">Cognito User Pool</text><text x="474" y="614" font-size="17" fill="#526978">Email account and sign-in</text>
 <rect x="846" y="480" width="316" height="174" rx="20" fill="#fff"/><rect x="846" y="480" width="316" height="12" rx="6" fill="#a690e9"/>
 <text x="876" y="531" font-size="17" font-weight="700" fill="#7057b5">04 · AWS IDENTITY</text><text x="876" y="575" font-size="27" font-weight="700" fill="#172f40">Cognito Identity Pool</text><text x="876" y="614" font-size="17" fill="#526978">Temporary AWS credentials</text>
 <rect x="846" y="232" width="316" height="172" rx="20" fill="#fff"/><rect x="846" y="232" width="316" height="12" rx="6" fill="#56bf94"/>
 <text x="876" y="283" font-size="17" font-weight="700" fill="#27815c">05 · PERMISSIONS</text><text x="876" y="327" font-size="28" font-weight="700" fill="#172f40">IAM Role</text><text x="876" y="365" font-size="17" fill="#526978">Access to own private prefix</text>
 <rect x="1210" y="277" width="158" height="180" rx="20" fill="#fff"/><rect x="1210" y="277" width="158" height="12" rx="6" fill="#f4b95f"/>
 <text x="1232" y="328" font-size="16" font-weight="700" fill="#9d6612">06 · FILES</text><text x="1232" y="371" font-size="30" font-weight="700" fill="#172f40">S3</text><text x="1232" y="409" font-size="16" fill="#526978">Private objects</text>
</g>
<g stroke="#70d3de" stroke-width="5" fill="none" marker-end="url(#arrow)">
 <path d="M334 326 H429"/><path d="M334 418 C379 418 392 553 429 553"/>
 <path d="M744 566 H830"/><path d="M1004 480 V420"/><path d="M1162 318 H1194"/>
</g>
<g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b9e4e8">
 <text x="343" y="312">Load site</text><text x="346" y="495">Sign in</text><text x="754" y="547">User token</text><text x="1024" y="450">Role</text><text x="1168" y="304">S3 access</text>
</g>
<rect x="74" y="728" width="1294" height="104" rx="18" fill="#0c2b40" stroke="#35667a"/>
<text x="104" y="769" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#78dce2">FILE OPERATIONS</text>
<text x="104" y="801" font-family="Arial, sans-serif" font-size="19" fill="#e2eef1">The signed-in browser calls S3 directly with temporary credentials:</text>
<text x="686" y="801" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">upload · list · download · delete</text>
<text x="80" y="866" font-family="Arial, sans-serif" font-size="15" fill="#a8c5d1">S3 path: private/{Cognito identity ID}/…   •   Bucket: drop-box-demo   •   Region: eu-north-1</text>
</svg>
